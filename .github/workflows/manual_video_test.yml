name: Manual Video Test

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Zodiac Sign to Generate (e.g., Aries)"
        required: true
        default: "Aries"
      mode:
        description: "Type of video (daily, weekly)"
        required: true
        default: "daily"

jobs:
  generate_test_video:
    runs-on: ubuntu-latest
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SKIP_UPLOAD: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick xvfb libgl1-mesa-dri libglapi-mesa libosmesa6 libgbm1 libxkbcommon0
          # Fix ImageMagick policy for MoviePy
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml
          pip install -r requirements.txt

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Remotion Dependencies
        run: |
          cd video-engine
          npm install

      - name: Run Bridge (Generate Data & Assets)
        env:
          TARGET_SIGN: ${{ inputs.sign }}
          VIDEO_MODE: ${{ inputs.mode }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Bridge generates video-engine/input.json and assets
          python bridge.py

      - name: Render Video (Remotion)
        run: |
          cd video-engine
          # Use xvfb-run to provide a virtual display for WebGL/Angle
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx remotion render src/index.tsx ZodiacVideo out/video.mp4 --props=./input.json --concurrency=1 --gl=angle --log=verbose

      - name: List Outputs
        run: ls -R video-engine/out/

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viral-video-${{ inputs.sign }}
          path: video-engine/out/*.mp4
          retention-days: 5
