name: Manual Video Test

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Zodiac Sign to Generate (e.g., Aries)"
        required: true
        default: "Aries"
      mode:
        description: "Type of video (daily, weekly)"
        required: true
        default: "daily"

jobs:
  generate_test_video:
    runs-on: ubuntu-latest
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SKIP_UPLOAD: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # Remotion Official Linux Dependencies (https://www.remotion.dev/docs/miscellaneous/linux-dependencies)
          # Using Ubuntu 24.04 (Noble) package names
          sudo apt-get install -y ffmpeg imagemagick \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
          # Fix ImageMagick policy for MoviePy
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml
          pip install -r requirements.txt

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Remotion Dependencies
        run: |
          cd video-engine
          npm install

      - name: Run Bridge (Generate Data & Assets)
        env:
          TARGET_SIGN: ${{ inputs.sign }}
          VIDEO_MODE: ${{ inputs.mode }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Bridge generates video-engine/input.json and assets
          python bridge.py

      - name: Debug - Show Input Data
        run: |
          echo "=== VTT File Content (first 20 lines) ==="
          head -20 video-engine/public/*.vtt || echo "No VTT found"
          echo ""
          echo "=== Input JSON - Captions Count ==="
          python -c "import json; d=json.load(open('video-engine/input.json')); print(f'Captions: {len(d.get(\"captions\", []))} entries'); print('First 3:', d.get('captions', [])[:3])"

      - name: Download Sound Effects
        run: |
          python -c "
          import urllib.request
          import os
          import time

          assets = {}

          os.makedirs('video-engine/public/assets', exist_ok=True)

          for path, url in assets.items():
              print(f'Downloading {path}...')
              retries = 3
              success = False
              while retries > 0:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req) as response, open(path, 'wb') as out_file:
                          data = response.read()
                          out_file.write(data)
                          if len(data) < 1000:
                              raise Exception('File too small, potentially invalid')
                      print(f'Successfully downloaded {path} ({os.path.getsize(path)} bytes)')
                      success = True
                      break
                  except Exception as e:
                      print(f'Error downloading {path}: {e}')
                      retries -= 1
                      time.sleep(2)
              
              if not success:
                  print(f'Failed to download {path} after retries.')
                  exit(1)
          "
          ls -la video-engine/public/assets/

      - name: Render Video (Remotion)
        env:
          # Suppress dbus errors in headless environment
          DBUS_SESSION_BUS_ADDRESS: /dev/null
        run: |
          cd video-engine
          # Use swangle (SwiftShader over Angle) - Remotion Lambda default, stable for CI
          npx remotion render src/index.tsx ZodiacVideo out/video.mp4 --props=./input.json --concurrency=1 --gl=swangle --log=verbose

      - name: List Outputs
        run: ls -R video-engine/out/

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viral-video-${{ inputs.sign }}
          path: video-engine/out/*.mp4
          retention-days: 5
