name: Zodiac Daily Automation

on:
  schedule:
    # US Morning Peak - 8:00 AM EST = 13:00 UTC
    # Prime time for horoscope content when users start their day
    - cron: "0 13 * * *"
    # Weekly on Sundays at 9:00 AM EST = 14:00 UTC
    - cron: "0 14 * * 0"
  workflow_dispatch:

jobs:
  daily-zodiac-production:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial for committing back updated JSONs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python Libraries
        run: |
          pip install -r requirements.txt
          pip install edge-tts google-auth-oauthlib google-api-python-client

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Node Dependencies
        run: |
          cd video-engine
          npm install

      - name: inject-secret
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          # Write the token.json from secrets using printf to preserve JSON
          printf '%s' "$YOUTUBE_TOKEN" > token.json
          echo "✅ token.json injected ($(wc -c < token.json) bytes)"

      - name: Run Video Automation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "🚀 Starting Video Production..."
          current_hour=$(date -u +%H)
          if [ "$current_hour" -eq "13" ]; then
             python master_brain.py --mode daily
          elif [ "$current_hour" -eq "14" ]; then
             python master_brain.py --mode weekly
          else
             python master_brain.py --mode all
          fi

          # Process and Upload All Pending Plans using the New Engine
          python bridge.py --batch

      - name: Upload Generated Videos (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-videos
          path: output_videos/
          retention-days: 5

      - name: Commit & Push Updates
        run: |
          git config --global user.name "Zodiac Bot"
          git config --global user.email "bot@zodiac365.com"

          # Pull latest changes to avoid conflicts
          git pull --rebase origin main || echo "Rebase failed (or no remote changes), continuing..."

          # Add all JSONs (Plans) and usage stats
          git add plan_*.json
          git add examples/*.json
          # Ensure image_usage.json exists before adding or ignore if missing
          touch image_usage.json 
          git add image_usage.json || true

          # Commit if changes exist
          git commit -m "🤖 Auto-Update: Horoscope Content & Upload Status" || echo "No changes to commit"
          git push
