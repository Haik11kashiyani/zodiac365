name: "Zodiac Batch 1 - Aries & Taurus"

on:
  schedule:
    # Daily at 4:00 AM ET = 09:00 UTC
    - cron: "0 9 * * *"
    # Weekly on Sundays at 5:00 AM ET = 10:00 UTC
    - cron: "0 10 * * 0"
  workflow_dispatch:

jobs:
  batch-1-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python Libraries
        run: |
          pip install -r requirements.txt
          pip install edge-tts google-auth-oauthlib google-api-python-client

      - name: Install Remotion System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Node Dependencies
        run: |
          cd video-engine
          rm -rf node_modules package-lock.json
          npm install
          echo "Remotion version: $(npx remotion --version)"

      - name: Inject Secret Token
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN" > token.json
          echo "✅ token.json injected ($(wc -c < token.json) bytes)"

      - name: Generate Content (Aries, Taurus)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "🚀 Batch 1: Aries, Taurus"
          current_hour=$(date -u +%H)
          if [ "$current_hour" -eq "9" ]; then
             python master_brain.py --mode daily --signs "Aries,Taurus"
          elif [ "$current_hour" -eq "10" ]; then
             python master_brain.py --mode weekly --signs "Aries,Taurus"
          else
             python master_brain.py --mode all --signs "Aries,Taurus"
          fi

      - name: Build & Upload Videos
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: python bridge.py --batch

      - name: Upload Generated Videos (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-1-videos
          path: output_videos/
          retention-days: 5

      - name: Commit & Push Updates
        run: |
          git config --global user.name "Zodiac Bot"
          git config --global user.email "bot@zodiac365.com"
          git pull --rebase origin main || echo "Rebase failed, continuing..."
          git add plan_*.json examples/*.json
          touch image_usage.json
          git add image_usage.json || true
          git commit -m "🤖 Batch 1 (Aries-Taurus): Auto-Update" || echo "No changes to commit"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push failed, retrying after pull..."
            sleep 10
            git pull --rebase origin main || true
          done
